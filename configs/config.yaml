

# Directory Settings
# All *_dir values are resolved relative to `project_dir` unless absolute.
paths:
  project_dir: ${TENNIS_DATA_PIPELINE_PROJECT_DIR} # default: auto-detected repo root
  data_dir: ${TENNIS_DATA_PIPELINE_DATA_DIR:data}
  raw_dir: ${TENNIS_DATA_PIPELINE_RAW_DIR:data/raw}
  clean_dir: ${TENNIS_DATA_PIPELINE_CLEAN_DIR:data/clean}
  archive_dir: ${TENNIS_DATA_PIPELINE_ARCHIVE_DIR:data/archive}
  mapping_dir: ${TENNIS_DATA_PIPELINE_MAPPING_DIR:data/mapping}
  linked_dir: ${TENNIS_DATA_PIPELINE_LINKED_DIR:data/linked}

# API Client Settings (defaults shared by data sources)
api:
  verify_ssl: ${API_VERIFY_SSL:true} # Enable/disable TLS certificate verification
  timeout_seconds: ${API_TIMEOUT_SECONDS:30.0} # Request timeout in seconds
  retry_insecure_on_ssl_error: ${API_RETRY_INSECURE_ON_SSL_ERROR:true}
  max_retries: ${API_MAX_RETRIES:3} # Retry attempts after the initial request
  backoff_seconds: ${API_BACKOFF_SECONDS:0.8} # Base exponential backoff delay in seconds

# Logging Settings
logging:
  output: ${LOG_OUTPUT:console} # Options: console, file, both (default: console)
  file_path: ${LOG_FILE_PATH:logs/tennis_data_pipeline.log} # Path for log file
  level: ${LOG_LEVEL:INFO} # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" # Log message format

# Tennis-Data.co.uk data source settings
tennis_data_uk:
  request_timeout_seconds: ${TENNIS_DATA_UK_TIMEOUT_SECONDS:30.0}
  retry_total: ${TENNIS_DATA_UK_RETRY_TOTAL:3}
  retry_backoff_factor: ${TENNIS_DATA_UK_RETRY_BACKOFF_FACTOR:0.5}
  path_prefix: ${TENNIS_DATA_UK_PATH_PREFIX:} # leave blank to use the client's last-known default
  github_user: ${TENNIS_DATA_UK_GITHUB_USER:}
  github_repo: ${TENNIS_DATA_UK_GITHUB_REPO:}
  # Stage-2 raw checkpoint naming: written to <paths.raw>/<raw_dir_name>/<tour>/<raw_filename_template>.
  raw_dir_name: ${TENNIS_DATA_UK_RAW_DIR_NAME:uk}
  # Not ${VAR:default}-wrapped: the {tour}/{year} placeholders themselves use
  # brace syntax, which would confuse the env-var substitution's own ${VAR:default} parsing.
  raw_filename_template: "uk_{tour}_singles_raw_{year}.csv"
  # Stage-4 clean checkpoint naming: written to <paths.clean>/<clean_dir_name>/<tour>/<clean_filename_template>.
  clean_dir_name: ${TENNIS_DATA_UK_CLEAN_DIR_NAME:uk}
  clean_filename_template: "uk_{tour}_singles_clean_{year}.csv"
  # Shared ATP+WTA quality report, relative to <paths.clean>/<clean_dir_name>/.
  quality_report_relpath: ${TENNIS_DATA_UK_QUALITY_REPORT_RELPATH:analysis/uk_quality_report.csv}
  # Tournament-summary table: written to <paths.clean>/<clean_dir_name>/<tour>/<tournament_dir_name>/<tournament_filename_template>.
  tournament_dir_name: ${TENNIS_DATA_UK_TOURNAMENT_DIR_NAME:tournaments}
  tournament_filename_template: "uk_{tour}_tournaments.csv"
  tournament_inconsistencies_filename_template: "uk_{tour}_tournament_inconsistencies.csv"

# Jeff Sackmann tennis archive (Aneeshers/tennis-sackmann-archive mirror) settings
sackmann:
  base_url: ${SACKMANN_BASE_URL:https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/main}
  request_timeout_seconds: ${SACKMANN_TIMEOUT_SECONDS:30.0}
  retry_total: ${SACKMANN_RETRY_TOTAL:3}
  retry_backoff_factor: ${SACKMANN_RETRY_BACKOFF_FACTOR:1.0}
  # Tournament-summary table: written to <paths.clean>/<clean_dir_name>/<tour>/<tournament_dir_name>/<tournament_filename_template>.
  clean_dir_name: sackmann
  tournament_dir_name: tournaments
  tournament_filename_template: "sackmann_{tour}_tournaments.csv"
  tournament_inconsistencies_filename_template: "sackmann_{tour}_tournament_inconsistencies.csv"

# Cross-source tournament id mapping (data/mapping/) - see mapper/tournaments.py
mapping:
  tournament_dir_name: tournaments
  crosswalk_filename_template: "{tour}_tournament_crosswalk.csv"
  source_links_filename_template: "{tour}_tournament_source_links.csv"
  manual_matches_filename_template: "{tour}_tournament_manual_matches.csv"
  min_match_score: ${MAPPING_MIN_MATCH_SCORE:0.5}
  # Pass-0 hand-maintained match-level override table (see mapper/matches/uk_sackmann/pass0.py).
  match_dir_name: matches
  match_manual_links_filename_template: "{tour}_manual_links.csv"

# Formalized per-year UK<->Sackmann linkage outputs (data/linked/{tour}/{year}/) -
# see mapper/matches/uk_sackmann/outputs.py
linked:
  review_dir_name: review
  match_links_filename_template: "{tour}_match_links_{year}.csv"
  enriched_matches_filename_template: "{tour}_matches_enriched_{year}.csv"
  linkage_summary_filename_template: "{tour}_linkage_summary_{year}.csv"
  linkage_ambiguous_filename_template: "{tour}_linkage_ambiguous_{year}.csv"
  linkage_unmatched_filename_template: "{tour}_linkage_unmatched_{year}.csv"

# WTA tournaments API (api.wtatennis.com) settings - no API key/auth required
wta_api:
  base_url: ${WTA_API_BASE_URL:https://api.wtatennis.com}
  request_timeout_seconds: ${WTA_API_TIMEOUT_SECONDS:30.0}
  retry_total: ${WTA_API_RETRY_TOTAL:3}
  retry_backoff_factor: ${WTA_API_RETRY_BACKOFF_FACTOR:0.5}
  # The server caps pageSize at 100 regardless of what's requested.
  page_size: ${WTA_API_PAGE_SIZE:100}
  # The site's TLS certificate fails verification as of 2026-09.
  verify_ssl: ${WTA_API_VERIFY_SSL:false}
  # Tournament-summary table: written to <paths.clean>/<clean_dir_name>/<tournament_dir_name>/<tournament_filename>.
  clean_dir_name: wta_api
  tournament_dir_name: tournaments
  tournament_filename: wta_api_tournaments.csv
  # Raw checkpoint (unmodified column names, one file per season): written to
  # <paths.raw>/<raw_dir_name>/<tournament_dir_name>/<raw_filename_template>.
  raw_dir_name: official/wta
  raw_filename_template: wta_api_tournaments_{year}.csv



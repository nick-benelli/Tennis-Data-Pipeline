[project]
name = "tennis-data-pipeline"
version = "0.1.0"
description = "Fetch, clean, and link tennis match/tournament data from multiple sources (Tennis-Data.co.uk, Jeff Sackmann's archive, WTA API)."
readme = "README.md"
authors = [
    { name = "Nick-Benelli", email = "31021342+nick-benelli@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyaml>=26.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "xlrd>=2.0.2",
]

[project.scripts]
tennis-data-pipeline = "tennis_data_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 105
target-version = "py312"
# Exploratory notebooks and doc snippets aren't held to the same lint/format bar as src/scripts/tests.
extend-exclude = ["notebooks", "docs", "*.ipynb"]
# Honor extend-exclude even when pre-commit passes explicit staged file paths.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "D100", # missing docstring in public module
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstring in public function
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
